name: release
on:
  push:
    tags: ["cli-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Tag matches package version
        run: |
          version="$(jq -r .version packages/cli/package.json)"
          test "$GITHUB_REF_NAME" = "cli-v$version" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle runs under node and bun
        run: |
          set -o pipefail
          smoke="--no-repo --remote https://github.com/acme/shop --given packages/cli/test/smoke --diff packages/cli/test/smoke/change.diff --format json"
          bun run --filter @lore/cli build
          node packages/cli/dist/lore.js select $smoke | jq -e '.rules[0].id == "smoke-rule"'
          bun packages/cli/dist/lore.js select $smoke | jq -e '.rules[0].id == "smoke-rule"'
          test "$(bun packages/cli/dist/lore.js --version)" = "0.1.0"
      - run: gh release create "$GITHUB_REF_NAME" packages/cli/dist/lore.js --title "lore $GITHUB_REF_NAME" --notes "Single-file build of the lore command. Run with node or bun."
        env:
          GH_TOKEN: ${{ github.token }}
